name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 버전을 올렸는지 확인
        run: node scripts/check-version.mjs origin/${{ github.base_ref }}
      - run: npm test
        env:
          TZ: Asia/Seoul
      - run: npm run build
